name: Question / discussion
description: Ask about the codebase, data model, or design decisions.
title: "[q]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Most "why is it built this way" questions are answered in
        [`docs/ARCHITECTURE.md`](https://github.com/erovelli/medicaid-dent-policy/blob/main/docs/ARCHITECTURE.md)
        and the [ADRs](https://github.com/erovelli/medicaid-dent-policy/tree/main/docs/adr).
        Please skim those first.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you've already read, and what's still unclear.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I've read the README and docs/ARCHITECTURE.md.
          required: true
